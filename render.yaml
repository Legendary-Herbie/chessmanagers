services:
  - type: web
    name: chess-managers-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: chess-managers-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: chess-managers-test-db
    plan: free
    databaseName: chess_managers_test
    user: chess_managers_test
    ipAllowList: []
