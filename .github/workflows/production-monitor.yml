name: Production uptime and certificate

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ vars.PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS health endpoint
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          case "$PRODUCTION_URL" in https://*) ;; *) echo 'PRODUCTION_URL must use HTTPS.' >&2; exit 1;; esac
          curl --fail --silent --show-error --location --max-time 20 \
            --proto '=https' --tlsv1.2 "$PRODUCTION_URL/health" > health.json
          grep -q '"status"' health.json
      - name: Require at least 14 days of certificate validity
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          host=$(node -e "console.log(new URL(process.env.PRODUCTION_URL).hostname)")
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null \
            | openssl x509 -checkend 1209600 -noout
