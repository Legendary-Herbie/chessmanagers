name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chessmanagers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d chessmanagers_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/chessmanagers_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/chessmanagers_test
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      CORS_ORIGIN: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run
      - run: npm --prefix server test
      - run: npm run deploy:verify
      - run: docker build --tag onechessclub-ci:${{ github.sha }} .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chessmanagers_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d chessmanagers_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ['1025:1025', '8025:8025']
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/chessmanagers_e2e
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      CORS_ORIGIN: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: 1chessclub E2E <noreply@e2e.invalid>
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
